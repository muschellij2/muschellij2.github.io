  categories: [neuroimaging]
  cran: true
- title: WhiteStripe
  description: White-matter normalization for magnetic resonance images.
  path: https://cran.r-project.org/package=WhiteStripe
  categories: [neuroimaging]
  cran: true
- title: stapler
  description: Simultaneous Truth and Performance Level Estimation (STAPLE).
  path: https://cran.r-project.org/package=stapler
  categories: [neuroimaging, statistics]
  cran: true
- title: gifti
  description: Read neuroimaging GIFTI files with geometry information.
  path: https://cran.r-project.org/package=gifti
  categories: [neuroimaging]
  cran: true
- title: cifti
  description: Toolbox for Connectivity Informatics Technology Initiative (CIFTI) files.
  path: https://cran.r-project.org/package=cifti
  categories: [neuroimaging]
  cran: true
- title: neurohcp
  description: Interface to the Human Connectome Project data.
  path: https://cran.r-project.org/package=neurohcp
  categories: [neuroimaging, interfaces]
  cran: true
- title: brainR
  description: Helper functions to misc3d and rgl for interactive 3D brain imaging.
  path: https://cran.r-project.org/package=brainR
  categories: [neuroimaging, visualization]
  cran: true
- title: kirby21.base
  description: Example data from the multi-modal MRI reproducibility resource (also kirby21.t1, kirby21.fmri).
  path: https://cran.r-project.org/package=kirby21.base
  categories: [neuroimaging, data]
  cran: true
- title: ichseg
  description: Intracerebral hemorrhage segmentation of CT scans.
  path: https://github.com/muschellij2/ichseg
  categories: [neuroimaging]
- title: lungct
  description: Segmentation and analysis of lung CT scans.
  path: https://github.com/muschellij2/lungct
  categories: [neuroimaging]
- title: extrantsr
  description: Additional functionality and extensions to ANTsR.
  path: https://github.com/muschellij2/extrantsr
  categories: [neuroimaging]
- title: spm12r
  description: R interface for SPM12 (Statistical Parametric Mapping) processing.
  path: https://github.com/muschellij2/spm12r
  categories: [neuroimaging]
- title: papayar
  description: View medical research images with the Papaya JavaScript viewer.
  path: https://github.com/muschellij2/papayar
  categories: [neuroimaging, visualization]
- title: dcm2niir
  description: R wrapper for the dcm2nii DICOM converter.
  path: https://github.com/muschellij2/dcm2niir
  categories: [neuroimaging]
- title: neurovault
  description: NeuroVault database API access.
  path: https://github.com/muschellij2/neurovault
  categories: [neuroimaging, interfaces]

