# One entry per package, shown in this order on the Software page.
# `cran: true` -> CRAN download badge; otherwise it is tagged "GitHub".
# CRAN list = packages with Muschelli as maintainer (tools::CRAN_package_db()).

# ---- wearables & accelerometry (jhuwit) ------------------------------------
- title: activerse
  description: Attach the whole family of actigraphy packages at once, tidyverse-style.
  path: https://jhuwit.github.io/activerse/
  categories: [wearables]
- title: actibase
  description: Baseline functions for actigraphy and activity processing and analysis.
  path: https://cran.r-project.org/package=actibase
  categories: [wearables]
  cran: true
- title: actiread
  description: Read actigraphy and activity data from many devices.
  path: https://cran.r-project.org/package=actiread
  categories: [wearables]
  cran: true
- title: actimetrics
  description: Create metrics for actigraphy and activity analysis.
  path: https://cran.r-project.org/package=actimetrics
  categories: [wearables]
  cran: true
- title: actisomni
  description: Create sleep measures from actigraphy data.
  path: https://cran.r-project.org/package=actisomni
  categories: [wearables]
  cran: true
- title: actiplot
  description: Plotting minute-level activity data.
  path: https://cran.r-project.org/package=actiplot
  categories: [wearables, visualization]
  cran: true
- title: actiquantiles
  description: Map activity data to normalized quantiles.
  path: https://cran.r-project.org/package=actiquantiles
  categories: [wearables]
  cran: true
- title: mapnhanespa
  description: Map quantiles for physical activity from NHANES.
  path: https://cran.r-project.org/package=mapnhanespa
  categories: [wearables]
  cran: true
- title: actisensorlog
  description: Summarize SensorLog / SensorLogger phone activity data.
  path: https://cran.r-project.org/package=actisensorlog
  categories: [wearables]
  cran: true
- title: actiwalkability
  description: Access the EPA Walkability Index.
  path: https://cran.r-project.org/package=actiwalkability
  categories: [wearables, interfaces]
  cran: true
- title: actinet
  description: Estimate human activity from accelerometry data.
  path: https://cran.r-project.org/package=actinet
  categories: [wearables]
  cran: true
- title: stepcount
  description: Estimate step counts from accelerometry data (wraps OxWearables stepcount).
  path: https://cran.r-project.org/package=stepcount
  categories: [wearables]
  cran: true
- title: walking
  description: Segment accelerometry data into walking bouts using open-source methods.
  path: https://cran.r-project.org/package=walking
  categories: [wearables]
  cran: true
- title: asleep
  description: Estimate sleep from accelerometry data.
  path: https://cran.r-project.org/package=asleep
  categories: [wearables]
  cran: true
- title: sleeper
  description: Estimate sleep status from wrist-worn accelerometry data.
  path: https://cran.r-project.org/package=sleeper
  categories: [wearables]
  cran: true
- title: stepcadence
  description: Compute cadence metrics from NHANES step-count data.
  path: https://github.com/jhuwit/stepcadence
  categories: [wearables]
- title: write.gt3x
  description: Write ActiGraph GT3X files.
  path: https://github.com/muschellij2/write.gt3x
  categories: [wearables]

# ---- neuroimaging ----------------------------------------------------------
- title: fslr
  description: Wrapper functions for FSL (FMRIB Software Library).
  path: https://cran.r-project.org/package=fslr
  categories: [neuroimaging]
  cran: true
- title: neurobase
  description: Neuroconductor base package with helper functions for nifti objects.
  path: https://cran.r-project.org/package=neurobase
  categories: [neuroimaging]
  cran: true
- title: freesurfer
  description: Wrapper functions for FreeSurfer.
